<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 220" role="img" aria-labelledby="title desc">
  <title id="title">Confronte de Liquidaciones EJF</title>
  <desc id="desc">Identidad visual de la herramienta para comparar documentación y recalcular intereses.</desc>
  <defs>
    <linearGradient id="wine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f0d18"/>
      <stop offset="0.58" stop-color="#821529"/>
      <stop offset="1" stop-color="#b12640"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1c1014" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect x="10" y="10" width="960" height="200" rx="30" fill="#fffdfa" stroke="#eadfe2"/>
  <g transform="translate(42 42)" filter="url(#shadow)">
    <rect width="136" height="136" rx="32" fill="url(#wine)"/>
    <rect x="24" y="25" width="72" height="82" rx="8" fill="#fffdfa"/>
    <rect x="42" y="39" width="72" height="82" rx="8" fill="#f1e7e9" stroke="#fffdfa" stroke-width="4"/>
    <path d="M56 61h42M56 75h28M56 89h42" stroke="#b99655" stroke-width="5" stroke-linecap="round"/>
    <circle cx="99" cy="96" r="24" fill="#365f91"/>
    <path d="m88 96 8 8 15-18" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="214" y="83" fill="#821529" font-family="Segoe UI, Arial, sans-serif" font-size="43" font-weight="800" letter-spacing="-1.25">Confronte de Liquidaciones EJF</text>
  <text x="216" y="125" fill="#36404b" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="650">Control documental · intereses · trazabilidad por período</text>
  <path d="M216 151h108" stroke="#b99655" stroke-width="5" stroke-linecap="round"/>
  <text x="340" y="158" fill="#707985" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600">Constancia + liquidación → revisión verificable</text>
  <text x="216" y="184" fill="#8b949f" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600">PDF y OCR local · cálculo explicable · control profesional</text>
